<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>宝可梦训练师成长日记</title>
  <meta name="description" content="小学生日常打卡工具：作业、阅读、运动、家务、睡眠">
  <meta name="theme-color" content="#2b2b28">
  <!-- 本站三套皮肤（彩色 / GBA / 墨水）都是浅底，声明 only light：
       手机系统开「深色模式」时，阻止浏览器强制把页面反色涂黑——
       否则原生时间选择器弹窗会出现浅字浅底 / 深字深底，完全看不清 -->
  <meta name="color-scheme" content="only light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="宝可梦训练日记">
  <meta name="application-name" content="宝可梦训练日记">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/gba.css">
<style>
  /* 首屏骨架：不等 30+ 个脚本全部下载完才有内容，避免长时间纯白 */
  #bootSplash{box-sizing:border-box;min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px;text-align:center;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#5a4632}
  #bootSplash img{width:88px;height:88px;object-fit:contain}
  #bootSplash b{font-size:15px;letter-spacing:.5px}
  #bootSplash small{font-size:12px;opacity:.62}
  #bootSplash .boot-dots{display:flex;gap:6px;margin-top:2px}
  #bootSplash .boot-dots i{width:7px;height:7px;border-radius:50%;background:#e0542f;opacity:.35;animation:bootPulse 1.1s ease-in-out infinite}
  #bootSplash .boot-dots i:nth-child(2){animation-delay:.18s}
  #bootSplash .boot-dots i:nth-child(3){animation-delay:.36s}
  @keyframes bootPulse{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-5px)}}
  @media (prefers-reduced-motion:reduce){#bootSplash .boot-dots i{animation:none}}
</style>
</head>
<body>

<header class="appbar">
  <div class="appbar__logo" id="appLogo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M8 12.5l2.8 2.8L16 9.5"></path>
    </svg>
  </div>
  <div class="appbar__text">
    <h1>宝可梦训练师成长日记</h1>
    <div class="appbar__date">
      <p id="todayLabel">—</p>
      <span id="topClock" title="北京时间">--:--:--</span>
      <span id="syncBadge" class="sync-badge" role="status" aria-live="polite"></span>
    </div>
  </div>
  <button type="button" class="appbar__parent" id="parentEntry" aria-label="进入家长后台">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
    <span>家长</span>
  </button>
</header>

<div class="press-hint" id="pressHint" role="status" aria-live="polite">
  <span class="press-hint__txt">继续按住进入家长后台…</span>
  <span class="press-hint__bar"><i id="pressBar"></i></span>
</div>

<main class="screen" id="screen">
  <div id="bootSplash" role="status" aria-live="polite">
    <img src="assets/tiny/025.webp" alt="">
    <b>正在打开训练日记…</b>
    <small>内容准备中，请稍等</small>
    <span class="boot-dots"><i></i><i></i><i></i></span>
  </div>
</main>

<div class="statusbar" id="statusbar"></div>

<nav class="tabbar" id="tabbar" role="tablist" aria-label="主导航"></nav>

<!-- defer：保持原有执行顺序，但让浏览器并行预取全部脚本，不再逐个阻塞页面解析 -->

</body>
</html>
